name: Keep Render API Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity sleep
    - cron: "*/14 * * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Endpoint
        # Replace 'https://your-render-api-url.onrender.com' with your actual Render URL
        run: curl -s https://your-render-api-url.onrender.com/health || echo "Ping failed"
